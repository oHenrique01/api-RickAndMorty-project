<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <title>Rick and Morty Explorer</title>
</head>

<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <span class="eyebrow">Rick &amp; Morty API</span>
        <h1 id="page-title">Explore personagens pelo ID</h1>
        <p>Digite um numero entre 1 e 826 para consultar imagem, status, especie, localizacao e episodios.</p>
      </div>

      <form action="" method="get" class="search-panel" aria-label="Buscar personagem">
        <label class="input-wrap" for="characterId">
          <span>ID do personagem</span>
          <input type="number" name="characterId" id="characterId" min="1" max="826" placeholder="Ex: 1">
        </label>
        <button type="submit" id="btn-go">Buscar</button>
      </form>
    </section>

    <section class="result-section" aria-live="polite">
      <div class="result-grid">
        <div class="preview-card" aria-label="Imagem do personagem">
          <div class="portal-placeholder" aria-hidden="true">
            <span></span>
          </div>
          <img src="" alt="Personagem de Rick and Morty" id="img">
          <input type="checkbox" id="favorite-character" class="favorite-toggle favorite-hidden" aria-label="Favoritar personagem">
          <label for="favorite-character" class="favorite-button favorite-hidden" title="Favoritar personagem"></label>
        </div>

        <div id="content" class="content">
          <div class="empty-state">
            <span class="empty-kicker">Pronto para buscar</span>
            <p>Informe um ID valido para abrir os dados do personagem.</p>
            <strong>ID valido: 1 a 826</strong>
          </div>
        </div>
      </div>
    </section>

    <div id="favorite-message" class="favorite-message" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="index.js"></script>
</body>

</html>
