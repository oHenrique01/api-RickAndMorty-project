<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Rick and Morty</title>
</head>

<body>
  <main class="app-shell">
    <header class="brand">
      <div>
        <span class="brand-badge">Rick & Morty</span>
        <h1 class="brand-title">Character Lookup</h1>
        <p class="brand-copy">Busque o ID de um personagem e veja os detalhes em um card estilizado.</p>
      </div>
      <div class="hero-visual" aria-hidden="true"></div>
    </header>

    <form action="" method="get" class="search-panel">
      <label class="input-wrap" for="characterId">
        <span>ID do personagem</span>
        <input type="number" name="characterId" id="characterId" min="1" placeholder="Ex: 1">
      </label>
      <button type="submit" id="btn-go">Buscar</button>
    </form>

    <section class="result-section">
      <div class="result-grid">
        <div class="preview-card">
          <img src="" alt="Rick and Morty character" id="img">
        </div>
        <div id="content" class="content">
          <div class="empty-state">
            <p>Digite um ID e clique em buscar para abrir o portal do universo Rick and Morty.</p>
            <strong>ID válido: 1 a 826</strong>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
